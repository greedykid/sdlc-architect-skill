name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repository guardrails
        run: node scripts/check-repo.mjs
      - name: Mermaid structure
        run: node scripts/check-mermaid.mjs
      - name: Behavioral scenario catalog
        run: node scripts/check-scenarios.mjs
      - name: SDLC governance coverage
        run: node scripts/check-governance.mjs
      - name: Forward-test plan coverage
        run: node scripts/check-forward-tests.mjs
      - name: Project state schema
        run: node scripts/check-project-state.mjs templates/project-state.md
      - name: Release metadata
        run: node scripts/check-release.mjs
      - name: Contrast checker self-test
        run: python3 skills/antislop-human/contrast-check.py --selftest
